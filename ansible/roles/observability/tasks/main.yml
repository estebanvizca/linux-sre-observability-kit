---
- name: Check whether promtail is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/promtail
  register: promtail_binary

- name: Read the installed promtail version
  ansible.builtin.command: /usr/local/bin/promtail --version
  register: promtail_installed_version
  changed_when: false
  failed_when: false
  when: promtail_binary.stat.exists

- name: Decide whether promtail must be installed
  ansible.builtin.set_fact:
    promtail_needs_install: >-
      {{ not promtail_binary.stat.exists
         or promtail_version not in (promtail_installed_version.stdout | default('')) }}

- name: Download the pinned promtail release
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-{{ promtail_arch }}.zip"
    dest: "/tmp/promtail-{{ promtail_version }}.zip"
    mode: "0644"
  when: promtail_needs_install

- name: Unpack promtail
  ansible.builtin.unarchive:
    src: "/tmp/promtail-{{ promtail_version }}.zip"
    dest: /tmp
    remote_src: true
  when: promtail_needs_install

- name: Install the promtail binary
  ansible.builtin.copy:
    src: "/tmp/promtail-linux-{{ promtail_arch }}"
    dest: /usr/local/bin/promtail
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: promtail_needs_install

- name: Create the promtail service account
  ansible.builtin.user:
    name: promtail
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups:
      - adm
      - systemd-journal
    append: true

- name: Create promtail directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: promtail
    group: promtail
    mode: "0750"
  loop:
    - /etc/promtail
    - /var/lib/promtail

- name: Configure promtail
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: /etc/promtail/config.yml
    owner: root
    group: promtail
    mode: "0640"
  notify: Restart promtail

- name: Install the promtail unit
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart promtail

- name: Enable promtail
  ansible.builtin.systemd:
    name: promtail
    enabled: true
    state: started
    daemon_reload: true
