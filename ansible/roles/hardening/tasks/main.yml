---
- name: Create the sshd drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable password and root SSH logins
  ansible.builtin.template:
    src: 00-lab-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-lab-hardening.conf
    owner: root
    group: root
    mode: "0644"
    # Refuse to reload a configuration that sshd itself rejects.
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Install the nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Configure the fail2ban SSH jail
  ansible.builtin.template:
    src: jail-lab.local.j2
    dest: /etc/fail2ban/jail.d/lab.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
    daemon_reload: true

- name: Enable automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable the unattended-upgrades service
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Lock the root account
  ansible.builtin.user:
    name: root
    password_lock: true
    state: present
