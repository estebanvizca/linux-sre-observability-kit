rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="node", instance="lab"}'
        values: '0+0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: HostDown
        exp_alerts:
          - exp_labels:
              job: node
              instance: lab
              severity: critical
            exp_annotations:
              summary: VM exporter unavailable
  - interval: 1m
    input_series:
      - series: 'sre_backup_last_exit_code{instance="lab"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels:
              instance: lab
              severity: critical
            exp_annotations:
              summary: Last backup failed
