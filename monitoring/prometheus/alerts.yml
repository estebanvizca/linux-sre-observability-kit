groups:
- name: sre-lab
  rules:
  - alert: HostDown
    expr: up{job="node"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: VM exporter unavailable
  - alert: HighCPU
    expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])))
      > 85
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: CPU above 85%
  - alert: LowMemory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Available memory below 10%
  - alert: DiskAlmostFull
    expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes
      < 0.15
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Filesystem free space below 15%
  - alert: BackupStale
    expr: time() - sre_backup_last_success_timestamp_seconds > 93600
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: No successful backup within 26 hours
  - alert: BackupFailed
    expr: sre_backup_last_exit_code != 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Last backup failed
  - alert: BackupMetricsMissing
    expr: absent(sre_backup_last_success_timestamp_seconds)
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Backup metrics unavailable
  - alert: TLSCertificateExpiring
    expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: TLS certificate expires within 14 days
  - alert: HTTPSProbeFailed
    expr: probe_success{job="tls"} == 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: HTTPS probe failed
  - alert: RestoreFailed
    expr: sre_restore_success == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: Latest restore drill failed
