global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:19100"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:18081"]
  - job_name: tls
    metrics_path: /probe
    params:
      module: [https]
    static_configs:
      - targets: ["https://github.com"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
