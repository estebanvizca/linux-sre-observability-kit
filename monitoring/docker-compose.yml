name: sre-observability
services:
  prometheus:
    image: prom/prometheus:v3.2.1
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.listen-address=127.0.0.1:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    network_mode: host
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--web.listen-address=127.0.0.1:9093", "--cluster.listen-address="]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager
    restart: unless-stopped
  loki:
    image: grafana/loki:3.3.2
    network_mode: host
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../.cache/secrets/grafana-password:/run/secrets/grafana-password:ro
      - grafana:/var/lib/grafana
    restart: unless-stopped
  rest-server:
    image: restic/rest-server:0.13.0
    network_mode: host
    environment:
      OPTIONS: --listen 127.0.0.1:18000 --append-only --htpasswd-file /run/secrets/htpasswd
    volumes:
      - ../.cache/secrets/rest-server.htpasswd:/run/secrets/htpasswd:ro
      - restic:/data
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    network_mode: host
    command: ["--listen_ip=127.0.0.1", "--port=18081", "--docker_only=true"]
    privileged: true
    devices: [/dev/kmsg:/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    network_mode: host
    command: ["--config.file=/etc/blackbox/config.yml", "--web.listen-address=127.0.0.1:9115"]
    volumes:
      - ./blackbox.yml:/etc/blackbox/config.yml:ro
    restart: unless-stopped
volumes:
  prometheus:
  alertmanager:
  grafana:
  loki:
  restic:
